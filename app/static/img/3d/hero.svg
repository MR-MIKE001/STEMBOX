<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-label="Stack of books with a graduation cap">
  <defs>
    <linearGradient id="bTop1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="bTop2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="bTop3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#e7e2d3"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <radialGradient id="bulb" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fffbeb"/><stop offset=".55" stop-color="#fde047"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <radialGradient id="nucleus" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#db2777"/></radialGradient>
  </defs>
  <ellipse cx="180" cy="240" rx="128" ry="13" fill="#1e1b4b" opacity=".18"/>
  <!-- bottom book -->
  <path d="M80 180 L180 210 L180 236 L80 206 Z" fill="#3730a3"/>
  <path d="M180 210 L280 180 L280 206 L180 236 Z" fill="url(#pages)"/>
  <path d="M180 213 L280 183 M180 219 L280 189 M180 225 L280 195 M180 231 L280 201" stroke="#d6cfbb" stroke-width="1.2"/>
  <path d="M80 180 L180 150 L280 180 L180 210 Z" fill="url(#bTop1)"/>
  <path d="M110 180 L180 159 L250 180" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- middle book -->
  <path d="M100 154 L190 181 L190 203 L100 176 Z" fill="#b45309"/>
  <path d="M190 181 L280 154 L280 176 L190 203 Z" fill="url(#pages)"/>
  <path d="M190 186 L280 159 M190 192 L280 165 M190 198 L280 171" stroke="#d6cfbb" stroke-width="1.2"/>
  <path d="M100 154 L190 127 L280 154 L190 181 Z" fill="url(#bTop2)"/>
  <!-- top book -->
  <path d="M110 130 L185 152 L185 172 L110 150 Z" fill="#115e59"/>
  <path d="M185 152 L260 130 L260 150 L185 172 Z" fill="url(#pages)"/>
  <path d="M185 157 L260 135 M185 163 L260 141" stroke="#d6cfbb" stroke-width="1.2"/>
  <path d="M110 130 L185 108 L260 130 L185 152 Z" fill="url(#bTop3)"/>
  <!-- graduation cap -->
  <path d="M160 101 L210 101 L206 118 Q185 127 164 118 Z" fill="#1e293b"/>
  <path d="M138 96 L185 80 L232 96 L185 112 Z" fill="url(#cap)"/>
  <path d="M185 96 L222 101 L224 120" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="224" cy="124" rx="5" ry="7" fill="#f59e0b"/>
  <circle cx="185" cy="96" r="3.5" fill="#f59e0b"/>
  <!-- atom -->
  <g transform="translate(70 72)" fill="none" stroke-width="4">
    <ellipse rx="34" ry="12" stroke="#38bdf8"/>
    <ellipse rx="34" ry="12" stroke="#0ea5e9" transform="rotate(60)"/>
    <ellipse rx="34" ry="12" stroke="#7dd3fc" transform="rotate(-60)"/>
    <circle r="9" fill="url(#nucleus)" stroke="none"/>
  </g>
  <!-- light bulb -->
  <g transform="translate(292 58)">
    <path d="M-22 -30 L-29 -37 M22 -30 L29 -37 M0 -40 L0 -50 M-32 -6 L-42 -6 M32 -6 L42 -6" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cy="-6" r="24" fill="url(#bulb)"/>
    <rect x="-11" y="16" width="22" height="9" rx="3" fill="#94a3b8"/>
    <rect x="-9" y="24" width="18" height="8" rx="3" fill="#64748b"/>
    <ellipse cx="-8" cy="-14" rx="6" ry="9" fill="#fff" opacity=".6"/>
  </g>
  <!-- sparkles -->
  <path d="M310 150 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#a78bfa"/>
  <path d="M40 160 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#f472b6"/>
  <circle cx="128" cy="40" r="5" fill="#fbbf24"/>
</svg>
